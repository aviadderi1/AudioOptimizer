name: Build macOS app

on:
  push:
    branches: [main]
    paths-ignore: ['docs/*.html', 'docs/assets/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AD-Audio-Optimizer-mac
          path: build/AD-Audio-Optimizer-mac.zip
      - name: Publish download (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AD Audio Optimizer for Windows and Mac (latest build)
          body: |
            **Windows:** download **AD-Audio-Optimizer-windows.zip**, right-click → Extract All, then run *ADAudioOptimizer.exe*. If Windows says "Windows protected your PC", click More info → Run anyway.

            **Mac:** download **AD-Audio-Optimizer-mac.zip**, unzip, and move *AD Audio Optimizer* to Applications.
            First launch: right-click the app → Open → Open (the app isn't notarized by Apple).
            Works on Apple Silicon (M1–M4) and Intel Macs, macOS 12 or newer.
          files: |
            build/AD-Audio-Optimizer-mac.zip
            docs/downloads/AD-Audio-Optimizer-windows.zip
          make_latest: true
